services:
  db:
    image: postgres:16
    environment: {POSTGRES_USER: sitaar, POSTGRES_PASSWORD: sitaar, POSTGRES_DB: sitaar}
    volumes: [pgdata:/var/lib/postgresql/data]
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg2://sitaar:sitaar@db:5432/sitaar
      SITAAR_DATA: /data
    volumes: [sitaar_data:/data]
    depends_on: [db]
volumes: {pgdata: {}, sitaar_data: {}}
